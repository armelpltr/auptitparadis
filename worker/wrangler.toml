name = "auptitparadis-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Deux choses que le navigateur ne peut pas faire seul : supprimer le compte
# Firebase de quelqu'un d'autre (le SDK ne sait supprimer que le compte
# connecté), et enregistrer une commande après avoir vérifié le jeton
# anti-bot auprès de Cloudflare. Les deux exigent la clé de service, d'où ce
# Worker — seul endroit où elle peut vivre sans être publique.

# Photos du site. Elles passaient par Cloudinary en envoi non signé, donc par
# un endpoint que n'importe qui sur Internet pouvait appeler — le nom du cloud
# et le preset vivent forcément dans le JavaScript du panel. Ici l'envoi exige
# un membre authentifié, et le Worker sert les fichiers lui-même : pas de
# bucket public à border.
#
# `jurisdiction = "eu"` garde les fichiers dans l'Union européenne. Ce n'est
# pas un simple indice de région : c'est une contrainte, et c'est ce qui
# permet à la page de confidentialité de l'annoncer. Le bucket doit être créé
# avec la même option, sinon la liaison ne le retrouve pas :
#   wrangler r2 bucket create auptitparadis-images --jurisdiction eu
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "auptitparadis-images"
jurisdiction = "eu"

# Purge des commandes dont la durée de conservation est passée. La nuit,
# à une heure creuse et décalée d'un quart d'heure : les crons qui tombent
# pile à l'heure ronde partagent la file d'attente de tout le monde.
[triggers]
crons = ["17 3 * * *"]

[vars]
ALLOWED_ORIGIN = "https://armelpltr.github.io"
FIREBASE_PROJECT_ID = "au-ptit-paradis"

# Base des liens envoyés par e-mail (« Gérer ma réservation »). Sans elle,
# la confirmation part sans lien d'annulation : le client garde son code,
# il ne peut simplement plus se décommander tout seul. À reprendre en même
# temps que ALLOWED_ORIGIN le jour d'un domaine personnalisé.
SITE_URL = "https://armelpltr.github.io/auptitparadis"

# Confirmations de commande (Brevo). Tant que EMAIL_EXPEDITEUR est vide ou
# que BREVO_API_KEY manque, aucun e-mail ne part : la commande est quand
# même enregistrée, et la page ne prétend pas avoir écrit au client.
#
# EMAIL_EXPEDITEUR doit être une adresse validée comme expéditeur dans
# Brevo (Senders → Add a sender → clic sur le lien de confirmation).
#
# Adresse provisoire, le temps que la boulangerie ait la sienne. À changer
# ici puis redéployer : elle est visible par tous les clients.
EMAIL_EXPEDITEUR = "pltrarmel@gmail.com"
EMAIL_EXPEDITEUR_NOM = "Au P'tit Paradis"
#
# Qui reçoit une alerte à chaque commande n'est plus réglé ici : chaque
# membre du panel coche ou décoche sa propre case dans l'onglet Équipe.
# L'absence de réglage vaut refus — personne n'est inscrit à son insu.

# Secrets à injecter :
#
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT
#     → JSON complet du compte de service (Firebase Console > Paramètres du
#       projet > Comptes de service > Générer une nouvelle clé privée)
#
#   wrangler secret put BREVO_API_KEY
#     → clé API v3 de Brevo (SMTP & API > API Keys). Facultative : sans
#       elle, les commandes fonctionnent, seuls les e-mails ne partent pas.
#
#   wrangler secret put TURNSTILE_SECRET
#     → clé secrète du widget Turnstile (dash.cloudflare.com > Turnstile).
#       Sans elle, POST /order refuse toute commande : mieux vaut un
#       formulaire en panne qu'un endpoint d'écriture ouvert aux robots.
